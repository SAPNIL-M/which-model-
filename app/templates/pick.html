<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose an answer</title></head>
<body><main><h1>Which answer is best?</h1><p id="progress"></p><p id="prompt"></p><div id="answers"></div><p id="status">Waiting for answers...</p>
<script>
let current;
async function load(){const r=await fetch('/api/next');const d=await r.json();if(d.complete){document.querySelector('#status').textContent='All prompts complete.';return}if(d.waiting){document.querySelector('#status').textContent='Still generating answers...';setTimeout(load,2000);return}current=d;document.querySelector('#progress').textContent=`${d.progress.current} of ${d.progress.total}`;document.querySelector('#prompt').textContent=d.prompt;const root=document.querySelector('#answers');root.innerHTML=d.answers.map(a=>`<article><h2>${a.label}</h2><pre>${a.text.replaceAll('&','&amp;').replaceAll('<','&lt;')}</pre><button data-id="${a.id}">Pick this one</button></article>`).join('')+'<button id="none">None are good</button>';root.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>send(Number(b.dataset.id),'picked'));root.querySelector('#none').onclick=()=>send(null,'none_good');document.querySelector('#status').textContent=''}
async function send(chosen,outcome){const ids=current.answers.map(a=>a.id);const r=await fetch('/api/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt_id:current.prompt_id,shown_answer_ids:ids,chosen_answer_id:chosen,outcome})});if(r.ok){const d=await r.json();document.querySelector('#answers').innerHTML='<p>Models revealed: '+d.reveals.map(x=>x.display_name).join(', ')+'</p><button onclick="load()">Next</button>'}else alert((await r.json()).error)}
load();
</script></main></body></html>
