<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhichModel?</title></head>
<body><main><h1>WhichModel?</h1><p>Compare anonymous AI answers to the prompts you actually use.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/enter">
<label>Invite code <input name="invite_code" required></label><br>
<label>Your name <input name="display_name" maxlength="100" required></label><br>
<label><input type="checkbox" name="consent_third_party" required> I understand my prompts are sent to third-party AI providers.</label><br>
<label><input type="checkbox" name="public_profile"> Allow my anonymized profile in public results.</label><br>
<button>Enter</button></form></main></body></html>
