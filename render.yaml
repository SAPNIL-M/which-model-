services:
  - type: web
    name: whichmodel
    runtime: python
    # Paid plan: free instances sleep when idle, which would stop the in-process generation worker.
    plan: starter
    region: singapore
    numInstances: 1 # the background worker lives in the web process; never scale out
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: whichmodel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GENERATION_ENABLED
        value: "true"
      - key: DAILY_CALL_CAP
        value: "100"
      - key: INVITE_CODES
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: whichmodel-db
    databaseName: whichmodel
    user: whichmodel
    # Free plan: expires 30 days after creation (enough for the challenge window).
    plan: free
    region: singapore
    ipAllowList: [] # only reachable from Render services
