services:
  - type: web
    name: whichmodel
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whichmodel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GENERATION_ENABLED
        value: "true"
      - key: DAILY_CALL_CAP
        value: "100"
      - key: INVITE_CODES
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: whichmodel-db
    databaseName: whichmodel
    user: whichmodel
    plan: free
