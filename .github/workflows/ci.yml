name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          NVIDIA_API_KEY: test-key
          GEMINI_API_KEY: test-key
          GROQ_API_KEY: test-key
          GENERATION_ENABLED: "false"
